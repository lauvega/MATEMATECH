<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matematech - Simulacros y preparación Saber 11">
    <meta name="author" content="Equipo Matematech">
    <title>Matematech - Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="split-container">
        <div class="brand-panel">
            <div class="brand-content">
                <div class="logo-box">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </div>
                <h1>Matematech</h1>
                <p>Tu pasaporte al éxito en las Pruebas Saber 11 con simulacros inteligentes.</p>
            </div>
            <div style="position: absolute; bottom: 20px; font-size: 0.8rem; color: rgba(255,255,255,0.6);">
                &copy; 2026 Matematech. Todos los derechos reservados.
            </div>
        </div>
        <div class="form-panel">
            <div class="auth-card">
                <h2>Iniciar Sesión</h2>
                <form th:action="@{/login}" method="POST">
                    <div class="input-group">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" name="correo" class="input-field" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="input-group">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" id="contrasena" name="contrasena" class="input-field" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Ingresar a la Plataforma</button>
                </form>
                <div class="auth-footer">
                    ¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a>
                </div>
            </div>
        </div>
    </div>
     <footer class="site-footer">
    © 2026 MATEMATECH · Proyecto académico
  </footer>
</body>
</html>
