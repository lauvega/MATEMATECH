<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Matematech - Registro de Estudiantes y Docentes">
    <meta name="author" content="Equipo Matematech">
    <title>Matematech - Registro</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script>
        function verificarRol() {
            const rolSelect = document.getElementById('rol').value;
            const adminCodeGroup = document.getElementById('adminCodeGroup');
            if (rolSelect === 'Docente') {
                adminCodeGroup.style.display = 'block';
            } else {
                adminCodeGroup.style.display = 'none';
            }
        }
    </script>
</head>
<body>
<div class="split-container">
    <div class="brand-panel">
        <div class="brand-content">
            <div class="logo-box">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            </div>
            <h1>Matematech</h1>
            <p>Únete a la comunidad líder en razonamiento cuantitativo para grado 11.</p>
        </div>
        <div style="position: absolute; bottom: 20px; font-size: 0.8rem; color: rgba(255,255,255,0.6);">
            &copy; 2026 Matematech. Todos los derechos reservados.
        </div>
    </div>
    <div class="form-panel">
        <div class="auth-card">
            <h2>Crear Cuenta</h2>

            <div th:if="${error}" class="error-msg" th:text="${error}"></div>

            <form th:action="@{/registro}" th:object="${usuario}" method="POST">

                <div class="input-group">
                    <label for="rol">Tipo de Usuario</label>
                    <select id="rol" th:field="*{rol}" class="input-field" onchange="verificarRol()" required>
                        <option value="Estudiante">Estudiante</option>
                        <option value="Docente">Docente</option>
                    </select>
                </div>

                <!-- Campo discreto para la clave verbal (Sin revelar texto secreto en pantalla) -->
                <div class="input-group" id="adminCodeGroup" style="display: none;">
                    <label for="codigoAdmin">Código de Autorización Docente</label>
                    <input type="password" id="codigoAdmin" name="codigoAdmin" class="input-field" placeholder="••••••••">
                </div>

                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="input-field" placeholder="Tu nombre" required>
                </div>
                <div class="input-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}" class="input-field" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" th:field="*{contrasena}" class="input-field" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
            <div class="auth-footer">
                ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
            </div>
        </div>
    </div>
</div>
<footer class="site-footer">
    © 2026 MATEMATECH · Proyecto académico
</footer>
</body>
</html>
